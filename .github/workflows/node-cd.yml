name: Node.js CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string

# Prevent multiple CD pipelines from modifying the GitOps repository
# at the same time.
concurrency:
  group: node-cd
  cancel-in-progress: false

jobs:

  # ============================================================
  # DEV
  # ============================================================
  Deploy-to-Dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Clone GitOps repository
      # ----------------------------------------------------------
      - name: Clone Kubernetes manifest repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone \
            https://x-access-token:${GH_PAT}@github.com/mohammedzuhair25/node-js-example-k8s.git

      # ----------------------------------------------------------
      # Install yq
      # ----------------------------------------------------------
      - name: Install yq
        uses: mikefarah/yq@v4.47.2

      # ----------------------------------------------------------
      # Update DEV image
      # ----------------------------------------------------------
      - name: Update Dev manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${IMAGE_TAG}\"" \
            values-dev.yaml

          echo "Updated Dev manifest:"
          cat values-dev.yaml

      # ----------------------------------------------------------
      # Commit and push DEV
      # ----------------------------------------------------------
      - name: Commit and push Dev
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-dev.yaml

          echo "Changes to be committed:"
          git diff --cached

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update dev image to ${IMAGE_TAG}"

          git push origin main


  # ============================================================
  # STAGING
  # ============================================================
  Deploy-to-Staging:
    name: Deploy to Staging

    needs:
      - Deploy-to-Dev

    runs-on: ubuntu-latest

    # IMPORTANT:
    #
    # Configure required reviewers/approval on the GitHub
    # "staging" environment.
    #
    # The job will pause here until staging approval is granted.
    environment:
      name: staging

    steps:

      # ----------------------------------------------------------
      # Clone GitOps repository
      # ----------------------------------------------------------
      - name: Clone Kubernetes manifest repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone \
            https://x-access-token:${GH_PAT}@github.com/mohammedzuhair25/node-js-example-k8s.git

      # ----------------------------------------------------------
      # Install yq
      # ----------------------------------------------------------
      - name: Install yq
        uses: mikefarah/yq@v4.47.2

      # ----------------------------------------------------------
      # Update STAGING image
      # ----------------------------------------------------------
      - name: Update Staging manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${IMAGE_TAG}\"" \
            values-staging.yaml

          echo "Updated Staging manifest:"
          cat values-staging.yaml

      # ----------------------------------------------------------
      # Commit and push STAGING
      # ----------------------------------------------------------
      - name: Commit and push Staging
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-staging.yaml

          echo "Changes to be committed:"
          git diff --cached

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update staging image to ${IMAGE_TAG}"

          git push origin main
  create-release-tag:
    name: Create Git Release Tag
    needs: Deploy-to-Staging
    runs-on: ubuntu-latest
    permissions:
     contents: write

    steps:

      # ------------------------------------------------------
      # Checkout complete repository including tags
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ----------------------------------------------------------
      # Create release tag
      # ----------------------------------------------------------

      - name: Create Release Tag
        shell: bash
        run: |

          set -euo pipefail

          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          COMMIT="${GITHUB_SHA}"

          echo "=============================================="
          echo "Creating release tag"
          echo "=============================================="

          echo "Tag    : $TAG"
          echo "Commit : $COMMIT"
          echo "Repo   : $GITHUB_REPOSITORY"

          # ------------------------------------------------------
          # Configure Git
          # ------------------------------------------------------

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # ------------------------------------------------------
          # Fetch tags
          # ------------------------------------------------------

          echo ""
          echo "Fetching tags..."

          git fetch origin --tags --force

          # ------------------------------------------------------
          # Verify commit
          # ------------------------------------------------------

          echo ""
          echo "Verifying commit..."

          git rev-parse "$COMMIT"

          # ------------------------------------------------------
          # Check local tag
          # ------------------------------------------------------

          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then

            echo "ERROR: Tag $TAG already exists locally."

            exit 1

          fi

          # ------------------------------------------------------
          # Check remote tag
          # ------------------------------------------------------

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then

            echo "ERROR: Tag $TAG already exists remotely."

            exit 1

          fi

          # ------------------------------------------------------
          # Create annotated tag
          # ------------------------------------------------------

          echo ""
          echo "Creating annotated tag..."

          git tag -a "$TAG" "$COMMIT" \
            -m "Release $TAG"

          # ------------------------------------------------------
          # Push tag
          # ------------------------------------------------------

          echo ""
          echo "Pushing tag..."

          git push origin "refs/tags/$TAG"

          echo ""
          echo "Tag created successfully: $TAG"

          # Make TAG available to next step
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}

          generate_release_notes: true

          draft: false
          prerelease: false
