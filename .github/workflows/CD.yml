name: Node.js CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      image_tag:
        description: Image tag
        required: true
        type: string

jobs:

  # ============================================================
  # DEV
  # ============================================================
  Deploy-to-Dev:
    name: Deploy to Dev

    if: inputs.environment == 'dev'

    runs-on: ubuntu-latest

    environment:
      name: dev

    concurrency:
      group: update-k8s-repo-dev
      cancel-in-progress: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Kubernetes manifest repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/mohammedzuhair25/node-js-example-k8s.git

      - name: Install yq
        run: |
          sudo snap install yq

      - name: Update Dev manifest
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${{ inputs.image_tag }}\"" \
            values-dev.yaml

          echo "Updated values-dev.yaml:"
          cat values-dev.yaml

      - name: Commit and push
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-dev.yaml

          git diff --cached

          git commit \
            -m "Update dev image to ${{ inputs.image_tag }}" \
            || echo "No changes to commit"

          git push origin main


  # ============================================================
  # STAGING
  # ============================================================
  Deploy-to-Staging:
    name: Deploy to Staging

    if: inputs.environment == 'staging'

    runs-on: ubuntu-latest

    environment:
      name: staging

    concurrency:
      group: update-k8s-repo-staging
      cancel-in-progress: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Kubernetes manifest repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/mohammedzuhair25/node-js-example-k8s.git

      - name: Install yq
        run: |
          sudo snap install yq

      - name: Update Staging manifest
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${{ inputs.image_tag }}\"" \
            values-staging.yaml

          echo "Updated values-staging.yaml:"
          cat values-staging.yaml

      - name: Commit and push
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-staging.yaml

          git diff --cached

          git commit \
            -m "Update staging image to ${{ inputs.image_tag }}" \
            || echo "No changes to commit"

          git push origin main
