name: Node.js CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string

      release_version:
        description: Release version (example: 1.3.1)
        required: true
        type: string

concurrency:
  group: node-cd
  cancel-in-progress: false

jobs:

  # ============================================================
  # DEV
  # ============================================================
  Deploy-to-Dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Clone Kubernetes manifest repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/mohammedzuhair25/node-js-example-k8s.git

      - name: Install yq
        uses: mikefarah/yq@v4.47.2

      - name: Update Dev manifest
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${{ inputs.image_tag }}\"" \
            values-dev.yaml

          echo "Updated Dev manifest:"
          cat values-dev.yaml

      - name: Commit and push Dev
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-dev.yaml

          git diff --cached

          git commit \
            -m "Update dev image to ${{ inputs.image_tag }}" \
            || echo "No changes to commit"

          git push origin main


  # ============================================================
  # STAGING
  # ============================================================
  Deploy-to-Staging:
    name: Deploy to Staging

    needs:
      - Deploy-to-Dev

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Clone Kubernetes manifest repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/mohammedzuhair25/node-js-example-k8s.git

      - name: Install yq
        uses: mikefarah/yq@v4.47.2

      - name: Update Staging manifest
        run: |
          cd node-js-example-k8s/k8s/helm-node-app

          yq -i \
            ".image.tag = \"${{ inputs.image_tag }}\"" \
            values-staging.yaml

          echo "Updated Staging manifest:"
          cat values-staging.yaml

      - name: Commit and push Staging
        run: |
          cd node-js-example-k8s

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/helm-node-app/values-staging.yaml

          git diff --cached

          git commit \
            -m "Update staging image to ${{ inputs.image_tag }}" \
            || echo "No changes to commit"

          git push origin main


  # ============================================================
  # RELEASE TAG
  # ============================================================
  Create-Release-Tag:
    name: Create Release Tag

    needs:
      - Deploy-to-Staging

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version: $RELEASE_VERSION"
            echo "Expected format: 1.3.1"
            exit 1
          fi

      - name: Create release tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="v${RELEASE_VERSION}"

          echo "Creating release tag: ${TAG}"
          echo "Docker image: ${IMAGE_TAG}"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists."
            exit 1
          fi

          git tag \
            -a "$TAG" \
            "$IMAGE_TAG" \
            -m "Release ${TAG}"

          git push origin "$TAG"
