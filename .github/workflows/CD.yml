name: Node.js CD

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true
jobs:
  Deploy-to-Dev:
    environment:
      name: dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            echo "Connected to server: ${{ secrets.SERVER_HOST }}"
            cd /home/ubuntu/nodejs-project/node-js-project-example
            pwd
            ls -ltr
            echo "Stopping application..."
            ./stop.sh || true
            echo "Updating source..."
            git fetch origin
            git reset --hard origin/main
            echo "Installing dependencies..."
            npm ci
            echo "Starting application..."
            ./start.sh || true
