name: Node.js CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD & LINT
  # ============================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # ============================================================
  # UNIT TESTS
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_FILE: test-results/junit.xml
        run: |
          mkdir -p test-results

          npm test -- \
            --coverage \
            --reporters=default \
            --reporters=jest-junit

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/junit.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Upload source code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-dependency
          path: |
            package.json
            package-lock.json
            *.mjs
            Dockerfile
            public/


  # ============================================================
  # BUILD DOCKER IMAGE
  # ============================================================
  build-image:
    name: Build Docker Image

    if: github.ref == 'refs/heads/main'

    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Download source code artifact
        uses: actions/download-artifact@v4
        with:
          name: image-dependency

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mzm1/node-swagger-metrics:${{ github.sha }}


  # ============================================================
  # TRIVY IMAGE SCAN
  # ============================================================
  scan-image-for-vulnerabilities:
    name: Scan Image for Vulnerabilities

    if: github.ref == 'refs/heads/main'

    needs:
      - build-image

    runs-on: ubuntu-latest

    steps:
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mzm1/node-swagger-metrics:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true


  # ============================================================
  # TRIGGER CD USING GITHUB REST API
  # ============================================================
  trigger-cd:
    name: Trigger CD

    if: github.ref == 'refs/heads/main'

    needs:
      - scan-image-for-vulnerabilities

    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:

      - name: Trigger CD Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IMAGE_TAG: ${{ github.sha }}
          RELEASE_VERSION: "1.3.1"
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Triggering CD pipeline..."
          echo "Repository: ${REPOSITORY}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Release version: ${RELEASE_VERSION}"

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/node-cd.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"image_tag\":\"${IMAGE_TAG}\",\"release_version\":\"${RELEASE_VERSION}\"}}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n 1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "${HTTP_CODE}" != "204" ]; then
            echo "ERROR: Failed to trigger CD workflow."
            exit 1
          fi

          echo "CD workflow triggered successfully."
