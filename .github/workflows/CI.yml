name: Node.js CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_FILE: test-results/junit.xml
        run: |
          mkdir -p test-results

          npm test -- \
            --coverage \
            --reporters=default \
            --reporters=jest-junit

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/junit.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-coverage
          path: coverage/
          if-no-files-found: warn    
          
      - name : Upload source code as artifact    
        uses: actions/upload-artifact@v4
        with:
          name: image-depedency
          path: |
           package.json
           package-lock.json
           *.mjs
           Dockerfile
           public/


  build-image:
    if: github.ref == 'refs/heads/main'
    needs: test
    env:
       Dockerimage: mzm1/node-swagger-metrics:${{ github.sha }}
    runs-on: ubuntu-latest
    steps:

    - name : Download source code artifact
      uses: actions/download-artifact@v4
      with:
        name: image-depedency

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
       context: .
       push: true  # or true if pushing to registry
       tags: mzm1/node-swagger-metrics:${{ github.sha }}

  Scan_image_for_vulnerabilities:
    if: github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    steps:
    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@v0.35.0
      with:
          image-ref: mzm1/node-swagger-metrics:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
          
  trigger-cd:
    name: Trigger CD
    needs:
      - build
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Trigger CD Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run CD.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f environment=dev \
            -f image_tag=${{ github.sha }}
