name: CI-Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - release/**
      - hotfix/**

  pull_request:
    branches:
      - main
      - develop
      - release/**

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for manual deployment
        required: false
        default: dev
        type: choice
        options:
          - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # Determine Environment
  # ============================================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
      is-release: ${{ steps.set-env.outputs.is-release }}

    steps:

      - name: Determine Environment
        id: set-env
        shell: bash
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"

          elif [[ "$BRANCH" == release/* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"

          elif [[ "$BRANCH" == "develop" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"

          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"

          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug Environment
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Environment: ${{ steps.set-env.outputs.environment }}"
          echo "Should Deploy: ${{ steps.set-env.outputs.should-deploy }}"
          echo "Is Release: ${{ steps.set-env.outputs.is-release }}"


  # ============================================================
  # CI
  # ============================================================
  ci:
    name: CI
    needs: setup

    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      checks: write
      pull-requests: write

    uses: mohammedzuhair25/node-js-project-example/.github/workflows/CI.yml@main

    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}


  # ============================================================
  # CD
  # ============================================================
  deploy-environment:
    name: Deploy to ${{ needs.setup.outputs.environment }}

    needs:
      - setup
      - ci

    if: |
      needs.setup.outputs.should-deploy == 'true' &&
      github.event_name == 'push'

    uses: mohammedzuhair25/node-js-project-example/.github/workflows/CD.yml@main

    with:
      environment: ${{ needs.setup.outputs.environment }}

    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
